# Kubernetes Secret Template for ReproCare Production
# Copy to secret.prod.yaml and populate with generated secrets before applying.
apiVersion: v1
kind: Secret
metadata:
  name: reprocare-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://reprocare:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/reprocare_db"
  ANATOMYBRIDGE_SERVICE_URL: "http://reprocare-imaging-service:8100"
  ANATOMYBRIDGE_SERVICE_API_KEY: "CHANGE_ME_GENERATE_SECURE_RANDOM_KEY"
  BOOTSTRAP_ADMIN_EMAILS: "admin@reprocare.org"
  NODE_ENV: "production"
