apiVersion: apps/v1
kind: Deployment
metadata:
  name: reprocare-web
  labels:
    app: reprocare-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reprocare-web
  template:
    metadata:
      labels:
        app: reprocare-web
    spec:
      containers:
        - name: web
          image: reprocare/web:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: reprocare-secrets
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reprocare-imaging
  labels:
    app: reprocare-imaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reprocare-imaging
  template:
    metadata:
      labels:
        app: reprocare-imaging
    spec:
      containers:
        - name: imaging
          image: reprocare/imaging:latest
          ports:
            - containerPort: 8100
          envFrom:
            - secretRef:
                name: reprocare-secrets
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reprocare-web-service
spec:
  selector:
    app: reprocare-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: reprocare-imaging-service
spec:
  selector:
    app: reprocare-imaging
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
  type: ClusterIP
