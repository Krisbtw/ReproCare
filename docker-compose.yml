services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://reprocare:password@db:5432/reprocare_db
      - ANATOMYBRIDGE_SERVICE_URL=http://imaging:8100
      - ANATOMYBRIDGE_SERVICE_API_KEY=reprocare-service-secret-key
    depends_on:
      - db
      - imaging

  imaging:
    build:
      context: ./imaging-service
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - ANATOMYBRIDGE_SERVICE_API_KEY=reprocare-service-secret-key
      - ANATOMYBRIDGE_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=reprocare
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=reprocare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

