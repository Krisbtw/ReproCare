services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-reprocare}:${DB_PASSWORD:?DB_PASSWORD must be set in production}@db:5432/${DB_NAME:-reprocare_db}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=postgresql://${DB_USER:-reprocare}:${DB_PASSWORD:?DB_PASSWORD must be set in production}@db:5432/${DB_NAME:-reprocare_db}
      - ANATOMYBRIDGE_SERVICE_URL=http://imaging:8100
      - ANATOMYBRIDGE_SERVICE_API_KEY=${ANATOMYBRIDGE_SERVICE_API_KEY:?ANATOMYBRIDGE_SERVICE_API_KEY must be set in production}
      - REPROCARE_IMAGING_STORAGE_DIR=/var/lib/reprocare/imaging
      - REPROCARE_IMAGING_BACKUP_DIR=/var/lib/reprocare/backups
      - REPROCARE_STORAGE_BACKEND=${REPROCARE_STORAGE_BACKEND:-local_durable}
      - BOOTSTRAP_ADMIN_EMAILS=${BOOTSTRAP_ADMIN_EMAILS:-}
    volumes:
      - imaging_storage_data:/var/lib/reprocare/imaging
      - imaging_backup_data:/var/lib/reprocare/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      imaging:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  imaging:
    build:
      context: ./imaging-service
      dockerfile: Dockerfile
    # Port 8100 is internal to docker network; not exposed publicly
    expose:
      - "8100"
    environment:
      - ANATOMYBRIDGE_SERVICE_API_KEY=${ANATOMYBRIDGE_SERVICE_API_KEY:?ANATOMYBRIDGE_SERVICE_API_KEY must be set in production}
      - ANATOMYBRIDGE_CORS_ORIGINS=${ANATOMYBRIDGE_CORS_ORIGINS:-https://reprocare.app}
      - ANATOMYBRIDGE_UMD_WEIGHTS=${ANATOMYBRIDGE_UMD_WEIGHTS:-/var/lib/reprocare/models/umd_unet3d.pt}
    volumes:
      - imaging_storage_data:/var/lib/reprocare/imaging:ro
      - model_checkpoints_data:/var/lib/reprocare/models
    restart: unless-stopped

  db:
    image: postgres:15.8-alpine
    # Bind PostgreSQL to loopback only if host administration is needed; internal Docker network used by web/migrate
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-reprocare}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in production}
      - POSTGRES_DB=${DB_NAME:-reprocare_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reprocare} -d ${DB_NAME:-reprocare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    # Bind prometheus to loopback only so it is not public
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert.rules:/etc/prometheus/alert.rules
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in production}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  imaging_storage_data:
  imaging_backup_data:
  model_checkpoints_data:
  grafana_data:
